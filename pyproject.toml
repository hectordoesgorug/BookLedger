[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookledger"
version = "0.1.0"
description = "Portable offline-first book collection and inventory manager"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "ttkbootstrap>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
bookledger = "bookledger.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
