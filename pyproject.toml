[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookledger"
dynamic = ["version"]
description = "Portable offline-first book collection and inventory manager"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "ttkbootstrap>=1.10", "qrcode>=8.2", "zeroconf>=0.132"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
bookledger = "bookledger.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bookledger.__version__"}
